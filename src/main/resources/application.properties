spring.application.name=gerenciaentregas

server.port=8081
spring.datasource.url=jdbc:postgresql://db-entregas:5432/${DB_NAME:encomendas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.rabbitmq.queue=notificacao.email
app.rabbitmq.exchange=notificacao.exchange
app.rabbitmq.routing-key=notificacao.email

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}